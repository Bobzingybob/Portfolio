<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Check if URL ends with ".html"
        if (window.location.pathname.endsWith('.html')) {
            // Redirect to the same page without ".html"
            window.location.href = window.location.pathname.replace('.html', '');
        }
    </script>
</head>
<body>
</body>
</html>
