<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // GitHub Pages 404.html clean URL routing
        // This allows clean URLs like /Portfolio/home instead of /Portfolio/index.html

        const l = window.location;

        // Extract the requested path (e.g., /Portfolio/home)
        let path = l.pathname;

        // Store the clean path for the router to use
        sessionStorage.cleanPath = path;

        // Redirect to index.html but the router will handle showing the right content
        // Use replace to not add to history
        l.replace(l.origin + '/Portfolio/?redirected=' + encodeURIComponent(path));
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
